name: Aqua Reminder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo config check
        run: npx expo config --type public

  expo-export:
    name: Expo production export
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Export production bundle
        run: npx expo export --platform android

      - name: Upload Expo export
        uses: actions/upload-artifact@v4
        with:
          name: aqua-reminder-expo-export
          path: dist/
          if-no-files-found: error
          retention-days: 7
